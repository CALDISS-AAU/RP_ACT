[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ACT"
version = "0.1.0"
description = "This is a dummy project setup using uv. Use as reference for other CALDISS projects"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.0",
    "nltk>=3.9.4",
    "optuna>=4.9.0",
    "matplotlib>=3.11.0",
    "pandas>=3.0.3",
    "polars>=1.30,<1.40",
    "polars-splitters>=0.3.4",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "ray>=2.56.0",
    "sentence-transformers>=5.5.1",
    "torch>=2.12.0",
    "transformers<5.0.0",
    "python-docx>=1.2.0",
    "scikit-learn>=1.9.0",
    "faiss-cpu>=1.15.0",
    "mistralai>=2.10.0",
    "rich>=15.0.0",
    "spacy>=3.8.16",
    "xlsxwriter>=3.2.9",
    "seaborn>=0.13.2",
    "da-core-news-trf",
]

[project.scripts]
create-pipeline = "Shared_Functions.Pipeline_Functions.pipeline_generator:main"
clear-pipeline = "Shared_Functions.Pipeline_Functions.wipe_pipeline_data:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["Shared_Functions*"]

[tool.uv.sources]
da-core-news-trf = { url = "https://github.com/explosion/spacy-models/releases/download/da_core_news_trf-3.8.0/da_core_news_trf-3.8.0-py3-none-any.whl" }
